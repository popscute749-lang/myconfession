
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Your Answer ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #fff0f3, #f8dce5);
  color: #684750;
}

.container {
  width: 100%;
  max-width: 600px;
  padding: 30px 22px;
  background: white;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 8px 25px #00000012;
}

h1 {
  font-size: 30px;
}

p {
  line-height: 1.8;
}

.choice {
  margin: 20px 0;
  padding: 14px;
  border-radius: 12px;
  background: #fce7ed;
}

textarea {
  width: 100%;
  min-height: 150px;
  padding: 15px;
  border: 1px solid #e6c4ce;
  border-radius: 12px;
  font: 15px Georgia, serif;
}

button {
  margin-top: 20px;
  padding: 14px 25px;
  border: none;
  border-radius: 25px;
  background: #c76b83;
  color: white;
  font-size: 15px;
}

.back {
  display: inline-block;
  margin-top: 22px;
  color: #a65d73;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Send Your Answer ♡</h1>

<p>
Thank you for making it this far.
I'd love to hear what you have to say.
</p>

<div class="choice">
<strong>Your answer:</strong>
<p id="selectedAnswer">Loading...</p>
</div>

<form
action="https://docs.google.com/forms/d/e/1FAIpQLSfZBhzm3k61XlrMjeTeP5yS6v7PwpCMM1cG0HDY34sf1yB1JA/formResponse"
method="POST">

<input
type="hidden"
name="entry.925893276"
id="answerInput">

<textarea
name="entry.1586313468"
placeholder="Write your message for me here..."
required></textarea>

<br>

<button type="submit">SEND ANSWER ♡</button>

</form>

<a class="back" href="page5.html">
← Back to the previous page
</a>

</div>

<script>
const answer = localStorage.getItem("herAnswer") || "";

document.getElementById("selectedAnswer").textContent =
answer || "No answer selected";

document.getElementById("answerInput").value = answer;
</script>

</body>
</html>
