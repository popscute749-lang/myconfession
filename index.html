
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f9e5ec">
<title>My Confession ♡</title>

<style>
:root {
  --pink: #f7dce6;
  --deep: #a34f70;
  --rose: #d98ca8;
  --cream: #fffaf8;
  --ink: #654453;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg,#fff8fa,#f9e7ed 55%,#fff9f7);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

.hero {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 28px 18px;
  position: relative;
  overflow: hidden;
}

.hero::before,
.hero::after {
  content: "♡";
  position: absolute;
  color: #e9b5c8;
  opacity: .45;
  font-size: 90px;
}

.hero::before {
  top: 8%;
  left: 8%;
  transform: rotate(-15deg);
}

.hero::after {
  right: 8%;
  bottom: 9%;
  transform: rotate(15deg);
}

.cover {
  text-align: center;
  max-width: 540px;
  width: 100%;
  position: relative;
  z-index: 1;
}

.kicker {
  letter-spacing: .22em;
  text-transform: uppercase;
  font: 11px Arial, sans-serif;
  color: #b4778e;
}

h1 {
  font-size: clamp(42px,10vw,68px);
  font-weight: normal;
  font-style: italic;
  color: var(--deep);
  margin: 16px 0 10px;
}

.subtitle {
  font-size: 17px;
  line-height: 1.7;
  color: #946879;
}

.envelope-wrap {
  margin: 34px auto 22px;
  width: 210px;
  height: 145px;
  position: relative;
  filter: drop-shadow(0 12px 18px #c88fa344);
}

.envelope {
  position: absolute;
  inset: 24px 0 0;
  background: #e9a9bf;
  border-radius: 8px;
  overflow: hidden;
}

.envelope::before,
.envelope::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-style: solid;
}

.envelope::before {
  left: 0;
  border-width: 0 105px 83px 0;
  border-color: transparent transparent #f4c8d7 transparent;
}

.envelope::after {
  right: 0;
  border-width: 0 0 83px 105px;
  border-color: transparent transparent #f0bfd0 transparent;
}

.flap {
  position: absolute;
  top: 24px;
  left: 0;
  width: 0;
  height: 0;
  border-left: 105px solid transparent;
  border-right: 105px solid transparent;
  border-top: 78px solid #d98ca8;
  transform-origin: top;
  transition: transform .7s;
  z-index: 3;
}

.heart {
  position: absolute;
  z-index: 4;
  left: 50%;
  top: 69px;
  transform: translateX(-50%);
  font-size: 28px;
  color: white;
}

.opened .flap {
  transform: rotateX(180deg);
}

button {
  border: 0;
  border-radius: 999px;
  background: var(--deep);
  color: white;
  padding: 13px 25px;
  cursor: pointer;
  font: inherit;
  box-shadow: 0 6px 16px #a34f7033;
  transition: transform .2s, background .2s;
}

button:hover {
  transform: translateY(-2px);
  background: #8f3f60;
}

.small {
  font: 11px Arial, sans-serif;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #b4778e;
  margin-top: 18px;
}

@media(max-width:480px) {
  .hero::before,
  .hero::after {
    font-size: 65px;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="cover">

    <div class="kicker">
      A little something for you
    </div>

    <h1>My Confession</h1>

    <div class="subtitle">
      Some feelings are too special to leave unspoken.
    </div>

    <div class="envelope-wrap" id="envelope">
      <div class="envelope"></div>
      <div class="flap"></div>
      <div class="heart">♡</div>
    </div>

    <button id="openBtn">
      OPEN ME ♡
    </button>

    <p class="small">
      Made with a little courage and a lot of feeling
    </p>

  </div>
</header>

<script>
const button = document.getElementById("openBtn");
const envelope = document.getElementById("envelope");

button.addEventListener("click", () => {
  envelope.classList.add("opened");
  button.textContent = "OPENING... ♡";
  button.disabled = true;

  setTimeout(() => {
    window.location.href = "page2.html";
  }, 850);
});
</script>

</body>
</html>
